name: Security
on:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

jobs:
  security:
    uses: lawois/.github/.github/workflows/security-reusable.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    with:
      # Private repos: keep private_repo: true (default). SARIF lands as artifact only.
      # Public repos: set private_repo: false to upload SARIF to the Security tab,
      # and optionally set enable_codeql: true with codeql_languages.
      private_repo: true
      enable_codeql: false
      codeql_languages: '[]'
