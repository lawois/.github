name: Security baseline (reusable)

on:
  workflow_call:
    inputs:
      private_repo:
        description: "Set true for private repos without GHAS. Skips SARIF upload to Code Scanning (which requires GHAS), keeps SARIF as a downloadable artifact instead."
        type: boolean
        default: true
      enable_codeql:
        description: "Run CodeQL. Free for public repos; requires GHAS for private repos."
        type: boolean
        default: false
      codeql_languages:
        description: 'JSON array of CodeQL languages, e.g. ["go","javascript-typescript"]. Only used when enable_codeql=true.'
        type: string
        default: '[]'
      severity:
        description: "Trivy severity filter."
        type: string
        default: "HIGH,CRITICAL"
      semgrep_config:
        description: "Semgrep ruleset (space-separated)."
        type: string
        default: "p/default p/security-audit p/secrets"

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  trufflehog:
    name: Verified secrets (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.83.7
        with:
          extra_args: --only-verified

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run semgrep
        run: |
          semgrep scan \
            --config "${SEMGREP_CONFIG}" \
            --sarif --output=semgrep.sarif \
            --error || true
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep_config }}
      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
      - name: Upload SARIF to Code Scanning
        if: ${{ always() && !inputs.private_repo }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Vulns / IaC (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: ignore
      - name: Upload SARIF to Code Scanning
        if: ${{ always() && !inputs.private_repo }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  codeql:
    name: CodeQL
    if: ${{ inputs.enable_codeql && inputs.codeql_languages != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql_languages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
